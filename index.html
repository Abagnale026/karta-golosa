<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta charset="utf-8">
<title>Карта модуля голоса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:Bitter,Georgia,"Times New Roman",serif;
  --bg:#EEF1F5;
  --surface:#FFFFFF;
  --surface-2:#F6F7FA;
  --col:#E6EAF0;
  --line:#DCE1E9;
  --line-strong:#BFC7D4;
  --link:#8E99AC;
  --ink:#131826;
  --ink-2:#4A5467;
  --ink-3:#7A8395;
  --accent:#3457DC;
  --focus:rgba(52,87,220,.26);
  --done:#1E9A68; --done-bg:#E1F4EA; --done-ink:#0A6441;
  --doing:#3457DC; --doing-bg:#E5EAFC; --doing-ink:#2340AE;
  --wait:#D07A0C; --wait-bg:#FCEBD3; --wait-ink:#874900;
  --paused:#7C8597; --paused-bg:#EAECF0; --paused-ink:#454F62;
  --todo:#A1A9B9; --todo-ink:#4A5467;
  --ask:#7A4ED6; --ask-bg:#F1EBFD; --ask-ink:#5332A5;
  --no:#CC4235; --no-bg:#FBE9E6; --no-ink:#9E2D1E;
  --on:#FFFFFF;
  --root-bg:#131826; --root-ink:#F3F5FA; --root-ink-2:#A9B2C6;
  --scrim:rgba(12,16,28,.32);
  --shadow:0 20px 60px -24px rgba(19,24,38,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0B10; --surface:#14161E; --surface-2:#191C26; --col:#12141B;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.22); --link:rgba(255,255,255,.38);
    --ink:#EEF1F8; --ink-2:#A6AFC2; --ink-3:#737C90;
    --accent:#7C98FF; --focus:rgba(124,152,255,.3);
    --done:#3FD9A0; --done-bg:rgba(63,217,160,.14); --done-ink:#86ECC6;
    --doing:#7C98FF; --doing-bg:rgba(124,152,255,.17); --doing-ink:#B3C4FF;
    --wait:#FFB449; --wait-bg:rgba(255,180,73,.15); --wait-ink:#FFD08B;
    --paused:#98A2B8; --paused-bg:rgba(152,162,184,.15); --paused-ink:#C7CEDC;
    --todo:#66708A; --todo-ink:#B7BFD0;
    --ask:#B98CFF; --ask-bg:rgba(185,140,255,.15); --ask-ink:#D8C0FF;
    --no:#FF7C6F; --no-bg:rgba(255,124,111,.14); --no-ink:#FFB3AA;
    --on:#0B0D14; --root-bg:#222842; --root-ink:#EEF1F8; --root-ink-2:#A6AFC2;
    --scrim:rgba(0,0,0,.55); --shadow:0 20px 60px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0B10; --surface:#14161E; --surface-2:#191C26; --col:#12141B;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.22); --link:rgba(255,255,255,.38);
  --ink:#EEF1F8; --ink-2:#A6AFC2; --ink-3:#737C90;
  --accent:#7C98FF; --focus:rgba(124,152,255,.3);
  --done:#3FD9A0; --done-bg:rgba(63,217,160,.14); --done-ink:#86ECC6;
  --doing:#7C98FF; --doing-bg:rgba(124,152,255,.17); --doing-ink:#B3C4FF;
  --wait:#FFB449; --wait-bg:rgba(255,180,73,.15); --wait-ink:#FFD08B;
  --paused:#98A2B8; --paused-bg:rgba(152,162,184,.15); --paused-ink:#C7CEDC;
  --todo:#66708A; --todo-ink:#B7BFD0;
  --ask:#B98CFF; --ask-bg:rgba(185,140,255,.15); --ask-ink:#D8C0FF;
  --no:#FF7C6F; --no-bg:rgba(255,124,111,.14); --no-ink:#FFB3AA;
  --on:#0B0D14; --root-bg:#222842; --root-ink:#EEF1F8; --root-ink-2:#A6AFC2;
  --scrim:rgba(0,0,0,.55); --shadow:0 20px 60px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column}
body.dr-open{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{width:13px;height:13px;flex:none;display:block}

.head{flex:none;display:grid;gap:10px;padding-block:14px 12px;padding-inline:20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:6}
.head-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.head-act{display:flex;flex-wrap:wrap;gap:8px}
h1{margin:0;font:700 22px/1.2 var(--f-head)}
.sub{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fbtn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:0;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.fbtn b,.pbtn b{font-weight:700;font-variant-numeric:tabular-nums}
.fbtn[aria-pressed="true"],.pbtn[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:1px}
.pbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.pbtn b{color:var(--ink-2)}
.pbtn.none,.pbtn.none b{color:var(--no-ink)}
.shown{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.btn:focus-visible,.fbtn:focus-visible,.pbtn:focus-visible,.box:focus-visible,.link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.t-done{background:var(--done-bg);color:var(--done-ink)}
.t-doing{background:var(--doing-bg);color:var(--doing-ink)}
.t-wait{background:var(--wait-bg);color:var(--wait-ink)}
.t-paused{background:var(--paused-bg);color:var(--paused-ink)}
.t-todo{background:var(--surface);color:var(--todo-ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.t-q{background:var(--ask-bg);color:var(--ask-ink)}
.t-w{background:var(--no-bg);color:var(--no-ink)}
.gl{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font:700 10.5px/1 var(--f-ui);font-style:normal;color:var(--on);flex:none}
.gl.q,.t-q .gl,.note-q .gl{background:var(--ask)}
.gl.w,.t-w .gl,.note-w .gl{background:var(--no)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font:600 9.5px/1 var(--f-ui);letter-spacing:.02em;flex:none}
.av.none{background:var(--no-bg);color:var(--no-ink);font-size:11px}

/* схема: главный блок, под ним ветки в ряд, у каждой ветки канбан по статусам */
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.nav button{border:0;background:none;padding:2px 6px;border-radius:6px;color:var(--ink-2);font-size:12.5px;font-weight:500;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.stage{position:relative;flex:1;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}
.scroller.grab{cursor:grabbing;user-select:none}
.canvas{position:relative;width:max-content;min-width:100%;padding:24px 28px 90px}
.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2}
.ln{fill:none;stroke:var(--link);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.arr{fill:var(--link)}
.board{position:relative;z-index:1}
.root-row{display:flex}
.lanes{display:flex;align-items:flex-start;gap:30px;margin-top:52px}
.lane{flex:none;padding:12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.box{color:var(--ink)}
.box.root{display:inline-block;padding:12px 20px 13px;border-radius:14px;background:var(--root-bg);color:var(--root-ink)}
.r-t{font:700 21px/1.2 var(--f-head)}
.r-m{margin-top:4px;font-size:12.5px;color:var(--root-ink-2)}
.box.area{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:9px 14px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--ink)}
.a-t{font:600 16px/1.25 var(--f-head)}
.a-m{font-size:12.5px;color:var(--ink-2)}
.cols{display:flex;align-items:flex-start;gap:8px;margin-top:30px}
.col{flex:none;min-width:200px;background:var(--col);border-radius:12px;padding:7px}
.col-head{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:600}
.col-head b{margin-left:auto;font-variant-numeric:tabular-nums}
.col-body{display:grid;gap:10px;margin-top:8px}
.tk{display:block}
.col .box.task{width:186px}
.box.task,.box.sub{border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;transition:box-shadow .15s,opacity .2s}
.box.task{padding:7px 9px 8px;border-radius:10px}
.box.sub{padding:5px 8px 6px;border-radius:8px}
.box.st-done{background:var(--done-bg);border-color:var(--done)}
.box.st-doing{background:var(--doing-bg);border-color:var(--doing)}
.box.st-wait{background:var(--wait-bg);border-color:var(--wait)}
.box.st-paused{background:var(--paused-bg);border-color:var(--paused);border-style:dashed}
.box.st-todo{background:var(--surface);border-color:var(--line-strong)}
.box.task:hover,.box.sub:hover{box-shadow:0 0 0 3px var(--line)}
.box.sel,.box.hit{box-shadow:0 0 0 3px var(--focus)}
.dim{opacity:.2}
.subcols{display:flex;align-items:flex-start;gap:6px;margin:26px 0 4px 12px}
.subcol{flex:none;width:174px;padding:5px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.subcol-head{display:flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:600}
.subcol-head b{margin-left:auto;font-variant-numeric:tabular-nums}
.subcol-body{display:grid;gap:6px;margin-top:5px}
.b-top{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.st-done .b-top{color:var(--done-ink)} .st-doing .b-top{color:var(--doing-ink)} .st-wait .b-top{color:var(--wait-ink)} .st-paused .b-top{color:var(--paused-ink)} .st-todo .b-top{color:var(--todo-ink)}
.b-t{font-size:13px;line-height:1.3;font-weight:600;text-wrap:pretty}
.box.sub .b-t{margin-top:2px;font-size:12.5px;font-weight:500}
.b-bot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px}
.who{display:inline-flex;align-items:center;gap:5px;font-weight:500;min-width:0}
.who.none{color:var(--no-ink)}
.who .help{font-weight:400;color:var(--ink-3)}
.marks{display:inline-flex;align-items:center;gap:7px;flex:none}
.mk{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-variant-numeric:tabular-nums}
.mk.q{color:var(--ask-ink)} .mk.w{color:var(--no-ink)}
.b-det{display:none;flex-direction:column;gap:6px;margin-top:7px}
.detail .b-det{display:flex}
.dim-t{color:var(--ink-3)}
.waiting{display:flex;align-items:flex-start;gap:6px;padding:5px 8px;border-radius:7px;background:var(--surface);color:var(--wait-ink);font-size:12px;line-height:1.35}
.waiting .ic{margin-top:1px}
.decs{font-size:12px;line-height:1.35;color:var(--ink-2)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.decs ul{margin:3px 0 0;padding-left:15px;display:grid;gap:2px}
.decs .d{color:var(--ink-3);white-space:nowrap}
.note-q,.note-w{display:grid;grid-template-columns:15px minmax(0,1fr);gap:7px;padding:5px 8px;border-radius:7px;font-size:12px;line-height:1.35}
.note-q{background:var(--ask-bg);color:var(--ask-ink)}
.note-w{background:var(--no-bg);color:var(--no-ink)}
.note-q .gl,.note-w .gl{margin-top:1px}
.unconf{font-size:11.5px;color:var(--wait-ink);font-weight:500}

.tools{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3}
.zval{min-width:44px;text-align:center;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.btn.icon{width:32px;padding:0;font-size:17px}
@media (max-width:700px){
  .app{height:auto;min-height:100%}
  .stage{flex:none}
  .scroller{position:static;overflow:visible}
  .canvas{width:auto;padding:16px 16px 48px}
  .head{padding-inline:16px}
  .tools,.nav{display:none}
  .lanes{flex-direction:column;align-items:stretch;gap:24px;margin:30px 0 0 30px}
  .lane{padding:10px}
  .cols{flex-direction:column;align-items:stretch;gap:20px;margin:20px 0 0 24px}
  .col{width:auto}
  .col .box.task{width:auto}
  .subcols{flex-direction:column;align-items:stretch;gap:16px;margin:18px 0 4px 22px}
  .subcol{width:auto}
}

/* подробности */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:19}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:20;width:min(470px,100%);overflow:auto;overscroll-behavior:contain;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-bar{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.dr-body{padding:16px 20px 32px}
.dr-crumb{font-size:12.5px;color:var(--ink-3)}
.dr-body h2{margin:4px 0 12px;font:700 21px/1.28 var(--f-head);text-wrap:balance}
.dr-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.dr-owner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.bx{display:inline-block;margin-top:12px;font-size:13px}
.dr-note{margin:14px 0 0;font-size:14px;line-height:1.55;max-width:62ch}
.dr-unconf{margin:12px 0 0;padding:8px 10px;border-radius:8px;background:var(--wait-bg);color:var(--wait-ink);font-size:13px}
.sec{margin-top:22px}
.sec > .lbl{margin-bottom:8px}
.subs{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px;line-height:1.4}
.subs li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:7px}
.subs .ic{margin-top:3px}
.subs li span{color:var(--ink-2)}
.si-done{color:var(--done)} .si-doing{color:var(--doing)} .si-wait{color:var(--wait)} .si-paused{color:var(--paused)} .si-todo{color:var(--todo)}
.sec .note-q,.sec .note-w{font-size:13.5px;margin-top:6px}
.sec .waiting{font-size:13.5px;background:var(--wait-bg)}
.ents{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ents li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;font-size:13.5px;line-height:1.45}
.e-when{display:flex;flex-direction:column;font-size:12px;line-height:1.35;color:var(--ink-3);font-variant-numeric:tabular-nums}
.e-when a{font-weight:600;text-decoration:none}
.call{padding:14px 0;border-top:1px solid var(--line)}
.call-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.call-h b{font-size:14.5px;font-weight:600}
.call-h span{font-size:12.5px;color:var(--ink-3)}
.call ul{margin:7px 0 10px;padding-left:18px;display:grid;gap:4px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.call-a{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13px}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer}
/* инструкция */
.drawer.wide{width:min(580px,100%)}
.guide .lead{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.g-sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.guide h3{margin:0 0 14px;font:600 16.5px/1.3 var(--f-head)}
.g-p{margin:12px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.guide .btn,.guide .fbtn,.guide .pbtn{cursor:default}
.guide .btn:hover{border-color:var(--line-strong)}
.g-steps{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:16px}
.g-vis{display:flex;flex-direction:column;align-items:flex-start}
.g-ln{position:relative;flex:1;min-height:18px;width:10px;margin:3px 0 3px 13px;background:linear-gradient(var(--link),var(--link)) 50% 0/1.6px calc(100% - 6px) no-repeat}
.g-ln::after{content:"";position:absolute;left:0;bottom:0;border-style:solid;border-width:7px 5px 0;border-color:var(--link) transparent transparent}
.g-txt{padding:2px 0 14px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.g-txt b{display:block;margin-bottom:1px;font-size:14px;font-weight:600;color:var(--ink)}
.g-root{display:block;padding:7px 12px 8px;border-radius:10px;background:var(--root-bg);color:var(--root-ink);font:700 14px/1.2 var(--f-head);white-space:nowrap}
.g-area{display:block;padding:5px 10px 6px;border-radius:9px;background:var(--surface);border:2px solid var(--ink);font:600 13.5px/1.25 var(--f-head)}
.g-task{display:block;width:124px;padding:6px 9px 7px;border:1.5px solid;border-radius:9px}
.g-subs{display:grid;gap:5px;width:124px;padding:5px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.g-subs .tag{height:21px;padding:0 7px;font-size:11.5px}
.g-sub{display:block;padding:4px 7px 5px;border:1.5px solid;border-radius:7px;font-size:12px;font-weight:500}
.g-rows{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.g-row{display:grid;grid-template-columns:var(--gw,118px) minmax(0,1fr);gap:6px 16px;align-items:start;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.g-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.g-st{display:inline-flex;padding:4px 9px 5px;border:1.5px solid;border-radius:8px}
.g-tools{display:inline-flex;align-items:center;gap:6px}
.g-demo-wrap{display:grid;grid-template-columns:186px minmax(0,1fr);gap:14px 18px;align-items:start}
.box.task.g-demo,.box.task.g-demo:hover{width:186px;cursor:default;box-shadow:none}
.g-notes{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.g-notes .who{color:var(--ink)}
.g-notes .who.none{color:var(--no-ink)}
.g-ex{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.g-a{color:var(--accent);font-weight:600}
@media (max-width:600px){
  .g-stack .g-row,.g-demo-wrap{grid-template-columns:minmax(0,1fr)}
}

/* ---------- масштаб и прокрутка ---------- */
const PAD = 28;
function zoomTo(nk, fx, fy) {
  const r = scroller.getBoundingClientRect();
  if (fx == null) { fx = r.width / 2; fy = r.height / 2; }
  const px = (scroller.scrollLeft + fx - PAD) / k, py = (scroller.scrollTop + fy - 24) / k;
  k = Math.max(0.3, Math.min(1.5, nk));
  board.style.zoom = k;
  $("#z-val").textContent = Math.round(k * 100) + "%";
  scroller.scrollLeft = px * k + PAD - fx;
  scroller.scrollTop = py * k + 24 - fy;
  redraw();
}
$("#z-in").addEventListener("click", () => zoomTo(k * 1.15));
$("#z-out").addEventListener("click", () => zoomTo(k / 1.15));
$("#z-reset").addEventListener("click", () => zoomTo(1));
$("#z-all").addEventListener("click", () => {
  const w = board.offsetWidth, hgt = board.offsetHeight;
  zoomTo(Math.min((scroller.clientWidth - PAD * 2) / w, (scroller.clientHeight - 60) / hgt));
  scroller.scrollTo({ left: 0, top: 0 });
});
scroller.addEventListener("wheel", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const r = scroller.getBoundingClientRect();
  const f = Math.abs(e.deltaY) >= 40 ? Math.exp(-Math.sign(e.deltaY) * 0.15) : Math.exp(-e.deltaY * 0.01);
  zoomTo(k * f, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
let drag = null;
let dragged = false;
scroller.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0 || narrow.matches) return;
  drag = { x: e.clientX, y: e.clientY, sl: scroller.scrollLeft, st: scroller.scrollTop };
  dragged = false;
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragged && Math.hypot(dx, dy) < 5) return;
  dragged = true;
  scroller.classList.add("grab");
  scroller.scrollLeft = drag.sl - dx;
  scroller.scrollTop = drag.st - dy;
});
window.addEventListener("pointerup", () => {
  if (!drag) return;
  drag = null;
  scroller.classList.remove("grab");
  if (dragged) setTimeout(() => { dragged = false; }, 0);
});
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  const lane = $(`.lane[data-lane="${b.dataset.go}"]`);
  if (lane) lane.scrollIntoView({ inline: "start", block: "nearest", behavior: "smooth" });
});

/* ---------- подсветка ---------- */
function paintFilter() {
  const on = filtering();
  $$(".tk").forEach(t => {
    const c = byId.get(t.dataset.tk);
    const hit = matches(c);
    const tb = t.querySelector(".box.task");
    tb.classList.toggle("hit", on && hit);
    tb.classList.toggle("dim", on && !hit);
    $$(".box.sub", t).forEach(s => {
      const sh = subMatches(c.subs[+s.dataset.sub], c);
      s.classList.toggle("hit", on && sh);
      s.classList.toggle("dim", on && !sh);
    });
    $$(".subcol", t).forEach(sc => {
      const any = c.subs.some(x => x.s === sc.dataset.col && subMatches(x, c));
      sc.querySelector(".subcol-head").classList.toggle("dim", on && !any);
    });
  });
  $$(".lane").forEach(l => {
    const a = D.areas.find(x => x.id === l.dataset.lane);
    const any = a.kids.some(c => matches(c) || c.subs.some(s => subMatches(s, c)));
    l.querySelector(".box.area").classList.toggle("dim", on && !any);
    $$(".col", l).forEach(col => {
      const s = col.dataset.col;
      const anyCol = a.kids.some(c => c.s === s && (matches(c) || c.subs.some(x => subMatches(x, c))));
      col.querySelector(".col-head").classList.toggle("dim", on && !anyCol);
    });
  });
  markSelected();
  redraw();
}
function render() { renderHead(); paintFilter(); }
function markSelected() {
  $$(".box.sel").forEach(x => x.classList.remove("sel"));
  if (openId) $$(`.box.task[data-task="${openId}"]`).forEach(x => x.classList.add("sel"));
}
function afterFilter() {
  render();
  if (!filtering()) return;
  const first = $(".box.hit");
  if (first) first.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
}
$("#status-row").addEventListener("click", e => {

  if (b.dataset.f === "s") F.s = F.s === b.dataset.v ? "" : b.dataset.v;
  else F[b.dataset.f] = !F[b.dataset.f];
  F.call = "";
  afterFilter();
});
$("#people-row").addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if (!b) return;
  F.who = F.who === b.dataset.v ? "" : b.dataset.v;

});
$("#reset").addEventListener("click", () => { F.s = ""; F.who = ""; F.q = false; F.w = false; F.call = ""; render(); });
$("#detail-btn").addEventListener("click", () => {

});
